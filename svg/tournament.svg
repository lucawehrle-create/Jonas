<?xml version="1.0" encoding="UTF-8"?>
        <svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
            <!-- Titel -->
            <text x="140" y="28" class="sketch-label" font-size="20">DAS GROSSE TURNIER</text>
            <path d="M140,32 Q260,37 410,32" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

            <!-- Tisch (leicht perspektivisch) -->
            <path d="M90,60 L420,60 L430,240 L80,240 Z" fill="white" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
            <!-- Mittellinie -->
            <path d="M90,150 Q255,146 430,150" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="8,5" fill="none"/>
            <!-- Netz (mit Pfosten) -->
            <line x1="255" y1="55" x2="255" y2="245" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
            <rect x="252" y="55" width="6" height="8" fill="#1a1a1a" rx="1"/>
            <rect x="252" y="237" width="6" height="8" fill="#1a1a1a" rx="1"/>
            <!-- Netz-Textur -->
            <line x1="255" y1="70" x2="255" y2="232" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3"/>

            <!-- === JONAS (rechts, cool, mit Dutt + Schnurrbart) === -->
            <g id="tournamentJonas">
                <circle cx="380" cy="295" r="24" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
                <!-- Lockige Haare + Dutt -->
                <path d="M360,282 Q358,272 365,268 Q372,264 380,264 Q388,264 395,268 Q402,272 400,282" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                <path d="M362,278 Q359,274 362,270" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M398,278 Q401,274 398,270" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
                <ellipse cx="380" cy="260" rx="10" ry="7" fill="white" stroke="#1a1a1a" stroke-width="2"/>
                <path d="M374,258 Q380,254 386,258" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
                <!-- Augen (fokussiert) -->
                <ellipse cx="374" cy="290" rx="4" ry="3.5" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
                <circle cx="374" cy="290" r="2" fill="#1a1a1a"/>
                <ellipse cx="386" cy="290" rx="4" ry="3.5" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
                <circle cx="386" cy="290" r="2" fill="#1a1a1a"/>
                <!-- Cool-Augenbrauen -->
                <path d="M369,284 Q374,281 379,283" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
                <path d="M381,283 Q386,281 391,284" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
                <!-- Schnurrbart -->
                <path d="M372,298 Q376,296 380,297 Q384,296 388,298" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                <!-- Grinsen -->
                <path d="M373,302 Q380,308 387,302" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                <!-- Körper -->
                <path d="M370,318 Q378,322 386,318" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
                <!-- Arm + Schläger -->
                <path d="M368,325 Q350,310 338,290" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                <ellipse cx="325" cy="272" rx="15" ry="18" fill="white" stroke="#1a1a1a" stroke-width="2.2" transform="rotate(-10, 325, 272)"/>
                <line x1="334" y1="287" x2="340" y2="295" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- === LUCA (links, panisch) === -->
            <g id="tournamentLuca">
                <circle cx="130" cy="295" r="24" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
                <!-- Augen (weit aufgerissen) -->
                <ellipse cx="124" cy="288" rx="5" ry="6" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
                <circle cx="124" cy="289" r="2.5" fill="#1a1a1a"/>
                <circle cx="125" cy="287.5" r="0.8" fill="white"/>
                <ellipse cx="136" cy="288" rx="5" ry="6" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
                <circle cx="136" cy="289" r="2.5" fill="#1a1a1a"/>
                <circle cx="137" cy="287.5" r="0.8" fill="white"/>
                <!-- Angst-Augenbrauen -->
                <path d="M118,280 Q124,277 130,282" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
                <path d="M132,282 Q138,277 144,280" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
                <!-- Offener Mund -->
                <ellipse cx="130" cy="304" rx="5" ry="6" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
                <!-- Schweisstropfen -->
                <path d="M156,280 Q158,272 160,280 Q158,286 156,280" fill="#1a1a1a"/>
                <path d="M160,292 Q162,286 164,292 Q162,296 160,292" fill="#1a1a1a" opacity="0.5"/>
                <!-- Körper -->
                <path d="M120,318 Q128,322 136,318" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
                <!-- Arm (schlaff) + Schläger (haengt) -->
                <path d="M142,322 Q155,330 160,340" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                <ellipse cx="170" cy="355" rx="12" ry="15" fill="white" stroke="#1a1a1a" stroke-width="2" transform="rotate(25, 170, 355)"/>
                <line x1="162" y1="342" x2="166" y2="348" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
            </g>

            <!-- Ball (fliegend) -->
            <circle cx="290" cy="125" r="8" fill="white" stroke="#1a1a1a" stroke-width="2.2"/>
            <path d="M284,122 Q290,128 296,122" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
            <path d="M330,200 Q310,160 292,132" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
            <line x1="300" y1="122" x2="308" y2="118" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="299" y1="128" x2="307" y2="128" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

            <!-- Labels -->
            <text x="355" y="358" class="sketch-label" font-size="16">JONAS</text>
            <text x="348" y="374" class="sketch-label-small" font-size="11">(ruhig, gefasst)</text>
            <text x="88" y="358" class="sketch-label" font-size="16">LUCA</text>
            <text x="88" y="374" class="sketch-label-small" font-size="11">(verängstigt)</text>

            <!-- Scoreboard -->
            <rect x="435" y="85" width="82" height="75" rx="2" fill="white" stroke="#1a1a1a" stroke-width="2"/>
            <text x="445" y="104" class="sketch-label" font-size="11">ERGEBNIS</text>
            <line x1="440" y1="108" x2="512" y2="108" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
            <text x="445" y="124" class="sketch-label" font-size="12">Satz 1: 11:5</text>
            <text x="445" y="140" class="sketch-label" font-size="12">Satz 2: 11:2</text>
            <text x="445" y="156" class="sketch-label-small" font-size="10">23.03.2026</text>
        </svg>
