                    <rect x="296" y="118" width="8" height="18" rx="3" fill="white" stroke="#1a1a1a" stroke-width="2"/>
                    <!-- Linker Arm (entspannt) -->
                    <path d="M172,135 Q155,145 148,160" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
