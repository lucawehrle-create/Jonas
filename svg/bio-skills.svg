<?xml version="1.0" encoding="UTF-8"?>
                <svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
                    <!-- Baby: runder Kopf, grosser als Körper -->
                    <path d="M150,95 Q148,52 170,42 Q190,34 200,42 Q210,34 218,48 Q230,60 225,95 Q222,112 210,118 Q190,126 170,118 Q152,110 150,95 Z" fill="white" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
