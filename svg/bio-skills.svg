                    <line x1="354" y1="64" x2="362" y2="58" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
                    <line x1="368" y1="78" x2="378" y2="76" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>

                    <!-- Labels -->
                    <text x="32" y="100" class="sketch-label" font-size="15" transform="rotate(-90, 55, 100)">ALTER: 0</text>
