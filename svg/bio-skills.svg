                    <circle cx="345" cy="68" r="7" fill="white" stroke="#1a1a1a" stroke-width="2"/>
                    <circle cx="362" cy="82" r="4.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
                    <circle cx="355" cy="55" r="5.5" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
                    <circle cx="338" cy="48" r="3" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
                    <!-- Flugbahn -->
                    <path d="M328,95 Q335,80 342,72" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
