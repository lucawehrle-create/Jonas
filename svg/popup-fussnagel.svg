<?xml version="1.0" encoding="UTF-8"?>
                <svg viewBox="0 0 180 175" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <style>
                            @keyframes nailGlowP { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.4); } }
                            @keyframes nailShineP { 0%,100% { opacity:0; } 50% { opacity:0.7; } }
                            @keyframes nailSparkle { 0%,100% { opacity:0; transform:scale(0); } 50% { opacity:1; transform:scale(1); } }
                            @keyframes footPresentWiggle { 0%,100% { transform:rotate(0deg); } 25% { transform:rotate(3deg); } 75% { transform:rotate(-3deg); } }
                            @keyframes jonasPrideNod { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
                            @keyframes cameraFlash { 0%,90%,100% { opacity:0; } 95% { opacity:0.3; } }
                            @keyframes scienceGuyShake { 0%,100% { transform:rotate(0deg); } 25% { transform:rotate(-5deg); } 75% { transform:rotate(5deg); } }
                            .nail-gp-1 { animation: nailGlowP 2s ease-in-out infinite; }
                            .nail-gp-2 { animation: nailGlowP 2s ease-in-out infinite 0.5s; }
                            .nail-gp-3 { animation: nailGlowP 2s ease-in-out infinite 1s; }
                            .nail-gp-4 { animation: nailGlowP 2s ease-in-out infinite 1.5s; }
                            .nail-sh { animation: nailShineP 2.5s ease-in-out infinite; }
                            .nail-sparkle1 { animation: nailSparkle 1.3s ease-in-out infinite 0.2s; transform-origin: center; }
                            .nail-sparkle2 { animation: nailSparkle 1.5s ease-in-out infinite 0.8s; transform-origin: center; }
                            .nail-sparkle3 { animation: nailSparkle 1.1s ease-in-out infinite 1.3s; transform-origin: center; }
                            .foot-present { animation: footPresentWiggle 2s ease-in-out infinite; transform-origin: 105px 135px; }
                            .jonas-pride { animation: jonasPrideNod 2.5s ease-in-out infinite; }
                            .cam-flash { animation: cameraFlash 4s ease-in-out infinite; }
                            .science-guy { animation: scienceGuyShake 1.8s ease-in-out infinite; transform-origin: 160px 120px; }
                        </style>
                    </defs>

                    <!-- === JONAS (Strichmännchen, stolz posierend) === -->
                    <g class="jonas-pride">
                        <!-- Kopf -->
                        <circle cx="55" cy="40" r="14" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
                        <!-- Lockige Haare -->
                        <path d="M44,34 Q42,26 46,22 Q50,20 54,20" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M66,34 Q68,26 64,22 Q60,20 56,20" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
                        <!-- Dutt -->
                        <ellipse cx="55" cy="18" rx="7" ry="5" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
                        <path d="M50,16 Q55,13 60,16" fill="none" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
                        <!-- Selbstbewusste Augen -->
                        <circle cx="50" cy="38" r="2" fill="#1a1a1a"/>
                        <circle cx="60" cy="38" r="2" fill="#1a1a1a"/>
                        <!-- Augenbraue (eine hochgezogen, cool) -->
                        <path d="M57,33 Q61,30 64,33" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- Stolzes Grinsen -->
                        <path d="M49,46 Q55,51 61,46" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>

                        <!-- Körper -->
                        <path d="M55,54 Q55,72 54,90" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                        <!-- Linker Arm (Hüfte, Power-Pose) -->
                        <path d="M55,64 Q40,68 35,78" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
                        <!-- Hand an Hüfte -->
                        <path d="M35,78 Q38,82 42,80" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- Rechter Arm (zeigt auf den Fuss) -->
                        <path d="M55,64 Q72,72 82,85" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
                        <!-- Zeigefinger -->
                        <path d="M82,85 L88,92" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

                        <!-- Linkes Bein (steht) -->
                        <path d="M54,90 Q48,110 42,130" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
                        <!-- Rechtes Bein (Fuss nach vorne gestreckt zum Zeigen) -->
                        <path d="M54,90 Q68,100 80,108" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
                    </g>

                    <!-- === DER BERÜHMTE FUSS (prominent, mit rosa Nägeln) === -->
                    <g class="foot-present">
                        <!-- Fuss -->
                        <path d="M80,108 Q85,105 95,102 Q105,100 115,102 Q120,103 122,108 Q124,115 118,118 Q108,122 95,120 Q85,118 80,112 Z" fill="white" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
                        <!-- Zehen -->
                        <path d="M115,102 Q118,97 122,102" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M108,100 Q110,96 114,100" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M102,100 Q104,96 107,100" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/>
                        <path d="M97,101 Q98,97 101,101" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
                        <!-- PINK NÄGEL (der Star!) -->
                        <ellipse cx="119" cy="100" rx="4.5" ry="3.5" fill="#ff69b4" stroke="#1a1a1a" stroke-width="1.5" class="nail-gp-1"/>
                        <ellipse cx="111" cy="98" rx="3.8" ry="3" fill="#ff69b4" stroke="#1a1a1a" stroke-width="1.3" class="nail-gp-2"/>
                        <ellipse cx="104" cy="98" rx="3.2" ry="2.5" fill="#ff69b4" stroke="#1a1a1a" stroke-width="1.3" class="nail-gp-3"/>
                        <ellipse cx="98" cy="99" rx="2.8" ry="2.2" fill="#ff69b4" stroke="#1a1a1a" stroke-width="1.2" class="nail-gp-4"/>
                        <!-- Glanzpunkte -->
                        <ellipse cx="117" cy="98" rx="1.5" ry="1" fill="white" opacity="0" class="nail-sh"/>
                        <ellipse cx="109" cy="96" rx="1.2" ry="0.8" fill="white" opacity="0" class="nail-sh" style="animation-delay:0.6s"/>
                        <ellipse cx="103" cy="97" rx="1" ry="0.7" fill="white" opacity="0" class="nail-sh" style="animation-delay:1.2s"/>
                    </g>

                    <!-- === FUNKELN um die Nägel === -->
                    <path d="M130,92 L132,86 L134,92 L140,92 L135,96 L137,102 L132,98 L127,102 L129,96 L124,92 Z" class="nail-sparkle1" fill="#ff69b4"/>
                    <path d="M90,88 L91,84 L92,88 L96,88 L93,90 L94,94 L91,91 L88,94 L89,90 L86,88 Z" class="nail-sparkle2" fill="#ff69b4"/>
                    <path d="M125,110 L126,107 L127,110 L130,110 L128,112 L128,115 L126,113 L124,115 L124,112 L122,110 Z" class="nail-sparkle3" fill="#ff69b4"/>

                    <!-- === VERWIRRTER WISSENSCHAFTLER (rechts unten) === -->
                    <g class="science-guy">
                        <!-- Kopf -->
                        <circle cx="160" cy="120" r="7" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
                        <!-- Brille -->
                        <circle cx="157" cy="119" r="3" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
                        <circle cx="163" cy="119" r="3" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
                        <line x1="160" y1="119" x2="160" y2="119" stroke="#1a1a1a" stroke-width="0.5"/>
                        <!-- Verwirrte Augen -->
                        <circle cx="157" cy="119" r="0.8" fill="#1a1a1a"/>
                        <circle cx="163" cy="119" r="0.8" fill="#1a1a1a"/>
                        <!-- O-Mund -->
                        <circle cx="160" cy="124" r="1.5" fill="white" stroke="#1a1a1a" stroke-width="0.8"/>
                        <!-- Haare (durcheinander) -->
                        <path d="M154,114 Q152,108 155,106" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
                        <path d="M158,113 Q159,107 162,106" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
                        <path d="M164,114 Q167,109 165,106" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
                        <!-- Körper -->
                        <path d="M160,127 L160,142" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
                        <!-- Arme (ratlos ausgestreckt) -->
                        <path d="M160,132 Q152,130 148,134" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
                        <path d="M160,132 Q168,130 172,134" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
                        <!-- Klemmbrett -->
                        <rect x="170" y="130" width="6" height="8" rx="1" fill="white" stroke="#1a1a1a" stroke-width="0.8"/>
                        <line x1="171" y1="133" x2="175" y2="133" stroke="#1a1a1a" stroke-width="0.4"/>
                        <line x1="171" y1="135" x2="174" y2="135" stroke="#1a1a1a" stroke-width="0.4"/>
                        <!-- Fragezeichen -->
                        <text x="153" y="108" font-family="Permanent Marker, cursive" font-size="9" fill="#888">?!</text>
                        <text x="167" y="112" font-family="Caveat, cursive" font-size="7" fill="#888">???</text>
                    </g>

                    <!-- === KAMERA-BLITZ (Paparazzi-Effekt) === -->
                    <circle cx="90" cy="50" r="60" fill="white" class="cam-flash" opacity="0"/>

                    <!-- Beschriftungen -->
                    <text x="4" y="70" font-family="Permanent Marker, cursive" font-size="8" fill="#888" transform="rotate(-12, 4, 70)">FASHION</text>
                    <text x="4" y="82" font-family="Permanent Marker, cursive" font-size="8" fill="#888" transform="rotate(-12, 4, 82)">ICON</text>

                    <!-- Pfeil zum Fuss -->
                    <path d="M25,88 Q50,95 78,108" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
                    <polygon points="78,108 74,103 72,110" fill="#888"/>

                    <!-- Label -->
                    <text x="28" y="168" font-family="Permanent Marker, cursive" font-size="11" fill="#888">ROSA IST HALTUNG</text>
                </svg>
